# Your Steam and Epic Games (found automatically) and the games you add
# yourself, like a modded copy, in one list with their pictures: play, sort,
# see hours played (per game and in total), rename and update from here. Click
# the tile to open it; drop a game's .exe or shortcut on the page, or press +,
# to add one. Python, standard library only. Network: only Steam's and Epic's
# own image servers and Steam's store, for game pictures (and only for games
# without a picture already on this PC).
